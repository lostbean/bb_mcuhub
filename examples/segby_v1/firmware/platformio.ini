; segby_v1 firmware (§08) — the worked EXAMPLE's ESP32 hubs (ADR-0003).
;
; This is a downstream CONSUMER of the bb_mcuhub C chassis: it pulls the chassis
; (codec, scheduler, router, transport, floor, segment, the arduino-esp32 link
; layer + the generic hub main loop) from the LIBRARY via `lib_deps`, NOT by
; globbing the library's sources into this build. The chassis is packaged as a
; self-contained PlatformIO library by firmware/library.json at the repo root.
;
; So each env's build = exactly ONE example device file (mcu/<hub>.cpp) + the
; chassis (from lib_deps) + this robot's GENERATED headers (-Igen/segby_v1). The
; device .cpp #includes its generated <hub>.glue.h, which #includes the chassis
; headers (frame.h, scheduler.h, router.h, link.h, floor.h, wire_contract.h) —
; all resolved from the library's include/ (via lib_deps) and -Igen/segby_v1.
; The esp32 main loop (hub_main.cpp) + link layer (link_esp32.cpp) also come from
; the library's src/esp32/ via lib_deps; link_esp32.cpp #includes the GENERATED
; wire_contract.h (BACKPLANE_TRANSPORT_UART), resolved from -Igen/segby_v1.
;
; Toolchain copied from the library's old segby envs: the pioarduino fork is
; required for arduino-esp32 3.x (ESP-IDF 5.x), which is where the TWAI driver API
; used by the chassis' link_esp32.cpp lives. board/framework/baud match.
;
; Four envs, all segby_v1:
;   blaster_root — segby_v1 Blaster, ROOT HUB (UART host ↔ UART backplane +
;                  IMU/range/LED), NODE 0x02.   pio run -e blaster_root -t upload
;   wheels_leaf  — segby_v1 Wheels, a UART leaf — ONE MKS Dual FOC board driving
;                  BOTH wheels behind two on-chip floors, NODE 0x05; pulls
;                  SimpleFOC on top of the chassis. pio run -e wheels_leaf -t upload
;   blaster_selftest / wheels_selftest — the same boards booted into the link
;                  self-test mode (loopback tester, verdict on the USB console);
;                  see those envs below.

[platformio]
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = lolin32_lite
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; The bb_mcuhub C chassis as a PlatformIO library (its library.json packages
; src/ + include/). From examples/segby_v1/firmware/ the library firmware dir is
; ../../../firmware; symlink:// is the in-tree-library pattern (a registry/git
; dep later, no build-shape change).
lib_deps =
  symlink://../../../firmware
build_flags =
  -Wall

; ---- segby_v1 Blaster = root hub (sense pose/range + drive LED + UART backplane
;      to the wheels leaf), NODE 0x02. Root-ness is GENERATED, not flagged
;      (ADR-0006): the DSL declares parent: :host, the generator emits ROOT_NODE
;      into gen/segby_v1/wire_contract.h, and the chassis derives IS_ROOT =
;      (MY_NODE == ROOT_NODE) — so -DMY_NODE=0x02 alone makes this the root, no
;      -DROOT_HUB. BACKPLANE_TRANSPORT_UART=1 (also generated) brings up Serial2
;      as the backplane (no CAN/TWAI). Only this env's device file is compiled
;      here; the chassis (incl. esp32 glue) comes from lib_deps. ----
[env:blaster_root]
build_flags =
  ${env.build_flags}
  -Igen/segby_v1
  -DMY_NODE=0x02
  ; 115200 (not 1 Mbit/s) on the host↔Blaster link: this hardware
  ; showed ~95% frame loss at 1 Mbit/s on this Pi↔Blaster wiring/ground.
  ; Must match the host's transport baud (SegbyV1.Host transport_opts).
  -DHOST_UART_BAUD=115200
build_src_filter =
  +<mcu/blaster.cpp>

; ---- segby_v1 Wheels = UART leaf, ONE MKS Dual FOC board driving BOTH wheels
;      behind two independent on-chip floors, NODE 0x05. SimpleFOC drives M0/M1
;      in torque-voltage mode (the move() calls are -DARDUINO-guarded). It pulls
;      the chassis (lib_deps, inherited) PLUS SimpleFOC. ----
[env:wheels_leaf]
lib_deps =
  ${env.lib_deps}
  askuric/Simple FOC@^2.3.4
build_flags =
  ${env.build_flags}
  -Igen/segby_v1
  -DMY_NODE=0x05
build_src_filter =
  +<mcu/wheels.cpp>

; ---- Link self-test boot mode: the same boards, booted as loopback testers
;      (jumper a link's RX<->TX, read PASS/FAIL on the USB console — no host, no
;      robot). Each env inherits its PRODUCTION env's build_flags BY REFERENCE
;      (${env:<prod>.build_flags}), so the pins/baud/node the test certifies can
;      never drift from the config the robot actually runs; -DBB_SELFTEST=1 swaps
;      the chassis' generic main loop for its self-test runner. The device file
;      is swapped for mcu/selftest_stub.cpp — no device hooks, no per-board
;      libraries (wheels_selftest deliberately does NOT inherit wheels_leaf's
;      lib_deps: no SimpleFOC, just the base [env] chassis).
;        pio run -e blaster_selftest -t upload   (then: pio device monitor)
;        pio run -e wheels_selftest -t upload    (then: pio device monitor) ----
[env:blaster_selftest]
build_flags =
  ${env:blaster_root.build_flags}
  -DBB_SELFTEST=1
build_src_filter =
  +<mcu/selftest_stub.cpp>

[env:wheels_selftest]
build_flags =
  ${env:wheels_leaf.build_flags}
  -DBB_SELFTEST=1
build_src_filter =
  +<mcu/selftest_stub.cpp>
