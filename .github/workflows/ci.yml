# CI for bb_mcuhub — the two strata that build and test without hardware:
#   - Elixir host (the :bb_mcuhub library + the segby_v1 example app)
#   - C firmware floor/wire path (host-compiled harnesses + the test-only NIF)
#
# What is intentionally NOT here (see README "Status"): the ESP32 `pio run`
# firmware build (downloads a 100s-of-MB toolchain — too heavy for every push;
# run it locally / on a release), the MuJoCo sim (example-only, opt-in via uv;
# the sim's Elixir tests use a fake child and need no Python), and the WDT
# boot-loop / motor-sign calibration (bench/QEMU only, by design).
#
# All deps are PUBLIC git/hex repos (lostbean/bb, mcass19/bb_tui) — no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hex 2.5.1 fixed the cross-OTP compiled-regex crash; use the current patch.
  HEX_VERSION: "2.5.3"

jobs:
  # --- Elixir library (root app :bb_mcuhub) -------------------------------
  # `mix test` ALSO host-compiles the test-only virtual-hub NIF via elixir_make
  # (the :test-only compilers gate in mix.exs), so this job needs a C compiler —
  # ubuntu-latest ships one. The C parity + drift tests run inside this suite.
  library:
    name: Library (Elixir ${{ matrix.beam.elixir }}, OTP ${{ matrix.beam.otp }}, bb ${{ matrix.bb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bb: [locked, minimum]
        # Explicit pairs: Elixir 1.19 does not support OTP 29.
        beam:
          - { elixir: "1.19.5", otp: "28.5.0.6" }
          - { elixir: "1.20.4", otp: "28.5.0.6" }
          - { elixir: "1.20.4", otp: "29.1" }
    steps:
      - uses: actions/checkout@v5

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.beam.otp }}
          elixir-version: ${{ matrix.beam.elixir }}

      - name: Pin Hex
        run: mix local.hex ${{ env.HEX_VERSION }} --force

      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-lib-${{ matrix.bb }}-${{ matrix.beam.otp }}-${{ matrix.beam.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-lib-${{ matrix.bb }}-${{ matrix.beam.otp }}-${{ matrix.beam.elixir }}-

      - name: Select minimum supported bb
        if: matrix.bb == 'minimum'
        run: |
          echo 'BB_VERSION=0.25.0' >> "$GITHUB_ENV"
          BB_VERSION=0.25.0 mix deps.update bb nx complex

      - name: Fetch deps
        run: mix deps.get

      # `mix ci` = format --check-formatted + compile --warnings-as-errors + test
      # --warnings-as-errors (the same one-command gate you run locally). The test
      # step builds the C NIF (elixir_make) and runs the cross-language C parity +
      # generator drift tests; test-file warnings fail here too.
      - name: CI gate (format + warnings-as-errors + test)
        run: mix ci

  # --- Example app (examples/segby_v1) ------------------------------------
  # A downstream consumer of the library (path dep). Pulls two public git deps
  # (lostbean/bb, mcass19/bb_tui). Its suite includes the example's drift test;
  # the sim tests use a fake child, so no Python/MuJoCo is needed here.
  example:
    name: Example (Elixir ${{ matrix.beam.elixir }}, OTP ${{ matrix.beam.otp }}, bb ${{ matrix.bb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bb: [locked, minimum]
        # Explicit pairs: Elixir 1.19 does not support OTP 29.
        beam:
          - { elixir: "1.19.5", otp: "28.5.0.6" }
          - { elixir: "1.20.4", otp: "28.5.0.6" }
          - { elixir: "1.20.4", otp: "29.1" }
    defaults:
      run:
        working-directory: examples/segby_v1
    steps:
      - uses: actions/checkout@v5

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.beam.otp }}
          elixir-version: ${{ matrix.beam.elixir }}

      - name: Pin Hex
        run: mix local.hex ${{ env.HEX_VERSION }} --force

      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            examples/segby_v1/deps
            examples/segby_v1/_build
          key: ${{ runner.os }}-mix-segby-${{ matrix.bb }}-${{ matrix.beam.otp }}-${{ matrix.beam.elixir }}-${{ hashFiles('examples/segby_v1/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-segby-${{ matrix.bb }}-${{ matrix.beam.otp }}-${{ matrix.beam.elixir }}-

      - name: Select minimum supported bb
        if: matrix.bb == 'minimum'
        run: |
          echo 'BB_VERSION=0.25.0' >> "$GITHUB_ENV"
          BB_VERSION=0.25.0 mix deps.update bb nx complex

      - name: Fetch deps
        run: mix deps.get

      # `mix ci` = format --check-formatted + compile --warnings-as-errors + test
      # --warnings-as-errors, run under MIX_ENV=test (the same one-command gate
      # you run locally). Test-file warnings fail here too.
      - name: CI gate (format + warnings-as-errors + test)
        run: mix ci

  # --- C firmware harnesses (firmware/test/) ------------------------------
  # `make` builds AND runs all five host-compiled harnesses (all: run). The
  # Makefile uses -Werror, so any warning fails. No device, no PlatformIO — the
  # proof the correctness core is freestanding C11 (see README "Portable core").
  c-harnesses:
    name: C harnesses (host-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build + run the C harnesses
        run: make
        working-directory: firmware/test

  # --- Formatting (the repo's own treefmt, via Nix) -----------------------
  # `nix flake check` runs checks.formatting = treefmt across the whole repo
  # (mix-format, nixfmt, prettier, shfmt, clang-format) — the SAME gate the
  # pre-commit hook and `nix fmt` use locally, so it can't drift from them.
  # This is why we don't run per-app `mix format` (the example has no
  # .formatter.exs; treefmt is the single source of truth).
  format:
    name: Format (treefmt via nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # No --no-build: the treefmt check is a derivation that must actually BUILD
      # to verify formatting (a bare eval would skip the check itself).
      - name: Check formatting
        run: nix flake check

  # --- Design layer gate (copy-installed checks, scripts/design-schema.json
  # stamped) ----------------------------------------------------------------
  design-gate:
    name: Design layer gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: design-render --check
        run: |
          shopt -s globstar nullglob
          for f in docs/design/**/design.md; do
            scripts/design-render "$f" --check
          done
      - name: layer-integrity
        run: scripts/layer-integrity .
